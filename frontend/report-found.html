<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item - Campus Lost & Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                🔍 Campus Lost & Found
            </div>
            <ul class="navbar-menu" id="navbarMenu">
                <li><a href="index.html">Home</a></li>
                <li><a href="view-lost.html">Lost Items</a></li>
                <li><a href="view-found.html">Found Items</a></li>
                <li id="authLinks">
                    <a href="login.html" class="btn-login">Login</a>
                </li>
                <li id="userLinks" style="display:none;">
                    <a href="dashboard.html" class="btn-dashboard">Dashboard</a>
                    <button onclick="logoutUser()" class="btn-logout">Logout</button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Report Found Item Form -->
    <section class="form-section">
        <div class="form-container">
            <h2>Report a Found Item</h2>
            <p class="form-subtitle">Help return lost items to their owners. Post details about what you found.</p>

            <form id="reportFoundForm" class="form">
                <div class="form-group">
                    <label for="title">Item Title *</label>
                    <input type="text" id="title" name="title" required placeholder="e.g., Black Backpack">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" name="category" required>
                            <option value="">Select Category</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Documents">Documents</option>
                            <option value="Accessories">Accessories</option>
                            <option value="Books">Books</option>
                            <option value="Keys">Keys</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Date Found *</label>
                        <div class="row">
                            <input type="date" id="dateDate" class="input-small" required>
                            <select id="dateHour" class="input-small" required>
                                <option value="">HH</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                            </select>
                            <input type="number" id="dateMinute" class="input-small" required min="0" max="59" step="1" placeholder="MM">
                            <select id="dateAmPm" class="input-small" required>
                                <option value="AM">AM</option>
                                <option value="PM">PM</option>
                            </select>
                        </div>
                        <p id="dateTimeDisplay" class="note">Selected time: --</p>
                    </div>
                </div>

                <div class="form-group">
                    <label for="location">Location Found *</label>
                    <input type="text" id="location" name="location" required placeholder="e.g., Library 3rd Floor, Science Block">
                </div>

                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" name="description" required placeholder="Detailed description of the item, including color, brand, condition, identifying marks, etc."></textarea>
                </div>

                <div class="form-group">
                    <label for="imageUrl">Image URL (Optional)</label>
                    <input type="url" id="imageUrl" name="imageUrl" placeholder="https://example.com/image.jpg">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Post Found Item</button>
            </form>

            <!-- Success/Error Messages -->
            <div id="reportMessage" class="message" style="display:none;"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Campus Lost & Found Portal. All rights reserved.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/feedback.js"></script>
    <script>
        // Helper: Get URL query param
        function getQueryParam(key) {
            const params = new URLSearchParams(window.location.search);
            return params.get(key);
        }

        function copyToClipboard(text) {
            if (!text) return;
            navigator.clipboard.writeText(text)
                .then(() => {
                    alert('Copied to clipboard: ' + text);
                })
                .catch(err => {
                    console.error('Copy failed:', err);
                });
        }

        // Check authentication and pre-fill form if coming from a lost item
        window.addEventListener('DOMContentLoaded', async () => {
            const isAuthenticated = await checkAuthentication();
            if (!isAuthenticated) {
                window.location.href = 'login.html';
                return;
            }

            const lostId = getQueryParam('lostId');
            if (lostId) {
                // Pre-fill form based on the lost item details
                try {
                    const resp = await fetch(`http://localhost:5000/api/items/${lostId}`);
                    const data = await resp.json();
                    if (data.success && data.item) {
                        const item = data.item;
                        document.getElementById('title').value = item.title;
                        document.getElementById('category').value = item.category;
                        document.getElementById('location').value = item.location;
                        document.getElementById('description').value = `Found this item near ${item.location}. Details from the lost report: ${item.description}`;

                        const note = document.createElement('div');
                        note.className = 'info';
                        note.innerHTML = `
                            <p><strong>Linked Lost Item ID:</strong> ${item._id} <button type="button" class="btn btn-tiny" onclick="copyToClipboard('${item._id}')">Copy</button></p>
                            <p>This report is linked to a lost item. You can update details if needed before posting.</p>
                        `;
                        document.querySelector('.form-container').insertBefore(note, document.getElementById('reportFoundForm'));
                    }
                } catch (error) {
                    console.error('Error loading lost item for prefill:', error);
                }
            }

            const dateInputs = ['dateDate', 'dateHour', 'dateMinute', 'dateAmPm'];
            dateInputs.forEach(id => {
                const e = document.getElementById(id);
                if (!e) return;
                e.addEventListener('change', () => {
                    const date = document.getElementById('dateDate').value;
                    const hour = document.getElementById('dateHour').value;
                    const minute = document.getElementById('dateMinute').value;
                    const ampm = document.getElementById('dateAmPm').value;
                    const display = document.getElementById('dateTimeDisplay');
                    if (!date || !hour || !minute || !ampm) {
                        display.textContent = 'Selected time: --';
                        return;
                    }
                    const hourNum = parseInt(hour, 10);
                    const hour24 = ampm === 'PM' ? (hourNum % 12) + 12 : (hourNum % 12);
                    const parsed = new Date(`${date}T${String(hour24).padStart(2, '0')}:${String(parseInt(minute, 10)).padStart(2, '0')}:00`);
                    display.textContent = `Selected time: ${parsed.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true })}`;
                });
            });
        });

        // Handle form submission
        document.getElementById('reportFoundForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const dateDate = document.getElementById('dateDate').value;
            const dateHour = document.getElementById('dateHour').value;
            const dateMinute = document.getElementById('dateMinute').value;
            const dateAmPm = document.getElementById('dateAmPm').value;
            const location = document.getElementById('location').value.trim();
            const description = document.getElementById('description').value.trim();
            const imageUrl = document.getElementById('imageUrl').value.trim();

            let dateTime;
            if (dateDate && dateHour && dateMinute && dateAmPm) {
                const hour12 = parseInt(dateHour, 10);
                let hour24 = hour12 % 12;
                if (dateAmPm === 'PM') hour24 += 12;
                const formattedDate = `${dateDate}T${String(hour24).padStart(2, '0')}:${String(dateMinute).padStart(2, '0')}:00`;
                dateTime = new Date(formattedDate).toISOString();
            } else {
                dateTime = '';
            }

            if (!title || !category || !dateTime || !location || !description) {
                Toast.error('Please fill in all required fields');
                return;
            }

            try {
                const submitBtn = document.querySelector('button[type="submit"]');
                LoadingState.show(submitBtn);
                
                const token = localStorage.getItem('token');
                const lostId = getQueryParam('lostId');
                const response = await fetch('http://localhost:5000/api/items', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({
                        title,
                        category,
                        type: 'found',
                        dateTime: new Date(dateTime).toISOString(),
                        location,
                        description,
                        imageUrl: imageUrl || null,
                        relatedItemId: lostId || null,
                    }),
                });

                const data = await response.json();

                if (data.success) {
                    Toast.success('Item posted successfully! Redirecting...');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    Toast.error(data.message || 'Error posting item');
                    LoadingState.hide(submitBtn);
                }
            } catch (error) {
                console.error('Error posting item:', error);
                Toast.error('Error posting item. Please try again.');
                LoadingState.hide(document.querySelector('button[type="submit"]'));
            }
        });

        // Show message function (legacy, kept for compatibility)
        function showMessage(text, type) {
            if (type === 'success') {
                Toast.success(text);
            } else {
                Toast.error(text);
            }
        }

        // Update displayed 12-hour time text when value changes
        document.getElementById('dateTime').addEventListener('change', (e) => {
            const display = document.getElementById('dateTimeDisplay');
            const value = e.target.value;
            if (!value) {
                display.textContent = 'Selected time: --';
                return;
            }
            const parsed = new Date(value);
            if (Number.isNaN(parsed.getTime())) {
                display.textContent = 'Selected time: invalid';
                return;
            }
            display.textContent = `Selected time: ${parsed.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true })}`;
        });
    </script>
</body>
</html>

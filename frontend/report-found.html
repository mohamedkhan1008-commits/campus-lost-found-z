<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item - Campus Lost & Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                🔍 Campus Lost & Found
            </div>
            <ul class="navbar-menu" id="navbarMenu">
                <li><a href="index.html">Home</a></li>
                <li><a href="view-lost.html">Lost Items</a></li>
                <li><a href="view-found.html">Found Items</a></li>
                <li id="authLinks">
                    <a href="login.html" class="btn-login">Login</a>
                </li>
                <li id="userLinks" style="display:none;">
                    <a href="dashboard.html" class="btn-dashboard">Dashboard</a>
                    <button onclick="logoutUser()" class="btn-logout">Logout</button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Report Found Item Form -->
    <section class="form-section">
        <div class="form-container">
            <h2>Report a Found Item</h2>
            <p class="form-subtitle">Help return lost items to their owners. Post details about what you found.</p>

            <form id="reportFoundForm" class="form">
                <div class="form-group">
                    <label for="title">Item Title *</label>
                    <input type="text" id="title" name="title" required placeholder="e.g., Black Backpack">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" name="category" required>
                            <option value="">Select Category</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Documents">Documents</option>
                            <option value="Accessories">Accessories</option>
                            <option value="Books">Books</option>
                            <option value="Keys">Keys</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dateTime">Date Found *</label>
                        <input type="datetime-local" id="dateTime" name="dateTime" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="location">Location Found *</label>
                    <input type="text" id="location" name="location" required placeholder="e.g., Library 3rd Floor, Science Block">
                </div>

                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" name="description" required placeholder="Detailed description of the item, including color, brand, condition, identifying marks, etc."></textarea>
                </div>

                <div class="form-group">
                    <label for="imageUrl">Image URL (Optional)</label>
                    <input type="url" id="imageUrl" name="imageUrl" placeholder="https://example.com/image.jpg">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Post Found Item</button>
            </form>

            <!-- Success/Error Messages -->
            <div id="reportMessage" class="message" style="display:none;"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Campus Lost & Found Portal. All rights reserved.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Helper: Get URL query param
        function getQueryParam(key) {
            const params = new URLSearchParams(window.location.search);
            return params.get(key);
        }

        function copyToClipboard(text) {
            if (!text) return;
            navigator.clipboard.writeText(text)
                .then(() => {
                    alert('Copied to clipboard: ' + text);
                })
                .catch(err => {
                    console.error('Copy failed:', err);
                });
        }

        // Check authentication and pre-fill form if coming from a lost item
        window.addEventListener('DOMContentLoaded', async () => {
            const isAuthenticated = await checkAuthentication();
            if (!isAuthenticated) {
                window.location.href = 'login.html';
                return;
            }

            const lostId = getQueryParam('lostId');
            if (lostId) {
                // Pre-fill form based on the lost item details
                try {
                    const resp = await fetch(`http://localhost:5000/api/items/${lostId}`);
                    const data = await resp.json();
                    if (data.success && data.item) {
                        const item = data.item;
                        document.getElementById('title').value = item.title;
                        document.getElementById('category').value = item.category;
                        document.getElementById('location').value = item.location;
                        document.getElementById('description').value = `Found this item near ${item.location}. Details from the lost report: ${item.description}`;

                        const note = document.createElement('div');
                        note.className = 'info';
                        note.innerHTML = `
                            <p><strong>Linked Lost Item ID:</strong> ${item._id} <button type="button" class="btn btn-tiny" onclick="copyToClipboard('${item._id}')">Copy</button></p>
                            <p>This report is linked to a lost item. You can update details if needed before posting.</p>
                        `;
                        document.querySelector('.form-container').insertBefore(note, document.getElementById('reportFoundForm'));
                    }
                } catch (error) {
                    console.error('Error loading lost item for prefill:', error);
                }
            }
        });

        // Handle form submission
        document.getElementById('reportFoundForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const dateTime = document.getElementById('dateTime').value;
            const location = document.getElementById('location').value.trim();
            const description = document.getElementById('description').value.trim();
            const imageUrl = document.getElementById('imageUrl').value.trim();

            if (!title || !category || !dateTime || !location || !description) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }

            try {
                const token = localStorage.getItem('token');
                const lostId = getQueryParam('lostId');
                const response = await fetch('http://localhost:5000/api/items', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({
                        title,
                        category,
                        type: 'found',
                        dateTime: new Date(dateTime).toISOString(),
                        location,
                        description,
                        imageUrl: imageUrl || null,
                        relatedItemId: lostId || null,
                    }),
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('Item posted successfully! Redirecting to dashboard...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 2000);
                } else {
                    showMessage(data.message || 'Error posting item', 'error');
                }
            } catch (error) {
                console.error('Error posting item:', error);
                showMessage('Error posting item. Please try again.', 'error');
            }
        });

        // Show message function
        function showMessage(text, type) {
            const messageDiv = document.getElementById('reportMessage');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>

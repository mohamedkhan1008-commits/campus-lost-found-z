<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Lost Item - Campus Lost & Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                🔍 Campus Lost & Found
            </div>
            <ul class="navbar-menu" id="navbarMenu">
                <li><a href="index.html">Home</a></li>
                <li><a href="view-lost.html">Lost Items</a></li>
                <li><a href="view-found.html">Found Items</a></li>
                <li id="authLinks">
                    <a href="login.html" class="btn-login">Login</a>
                </li>
                <li id="userLinks" style="display:none;">
                    <a href="dashboard.html" class="btn-dashboard">Dashboard</a>
                    <button onclick="logoutUser()" class="btn-logout">Logout</button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Report Lost Item Form -->
    <section class="form-section">
        <div class="form-container">
            <h2>Report a Lost Item</h2>
            <p class="form-subtitle">Help others find your lost belongings. Provide as much detail as possible.</p>

            <form id="reportLostForm" class="form">
                <div class="form-group">
                    <label for="title">Item Title *</label>
                    <input type="text" id="title" name="title" required placeholder="e.g., Black Backpack">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" name="category" required>
                            <option value="">Select Category</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Documents">Documents</option>
                            <option value="Accessories">Accessories</option>
                            <option value="Books">Books</option>
                            <option value="Keys">Keys</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Date Lost *</label>
                        <div class="row">
                            <input type="date" id="dateDate" class="input-small" required>
                            <select id="dateHour" class="input-small" required>
                                <option value="">HH</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                            </select>
                            <input type="number" id="dateMinute" class="input-small" required min="0" max="59" step="1" placeholder="MM">
                            <select id="dateAmPm" class="input-small" required>
                                <option value="AM">AM</option>
                                <option value="PM">PM</option>
                            </select>
                        </div>
                        <p id="dateTimeDisplay" class="note">Selected time: --</p>
                    </div>
                </div>

                <div class="form-group">
                    <label for="location">Location Lost *</label>
                    <input type="text" id="location" name="location" required placeholder="e.g., Library 3rd Floor, Science Block">
                </div>

                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" name="description" required placeholder="Detailed description of the item, including color, brand, condition, identifying marks, etc."></textarea>
                </div>

                <div class="form-group">
                    <label for="contactPhone">Contact Phone (optional)</label>
                    <input type="tel" id="contactPhone" name="contactPhone" placeholder="e.g., +1 555 123 4567">
                </div>

                <div class="form-group">
                    <label for="imageUrl">Image URL (Optional)</label>
                    <input type="url" id="imageUrl" name="imageUrl" placeholder="https://example.com/image.jpg">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Post Lost Item</button>
            </form>

            <!-- Success/Error Messages -->
            <div id="reportMessage" class="message" style="display:none;"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Campus Lost & Found Portal. All rights reserved.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/feedback.js"></script>
    <script>
        // Check authentication on page load
        window.addEventListener('DOMContentLoaded', async () => {
            const isAuthenticated = await checkAuthentication();
            if (!isAuthenticated) {
                window.location.href = 'login.html';
            }
        });

        // Update time preview display in 12-hour format
        const dateInputs = ['dateDate', 'dateHour', 'dateMinute', 'dateAmPm'];
        dateInputs.forEach(id => {
            const element = document.getElementById(id);
            if (element) {
                element.addEventListener('change', () => {
                    const date = document.getElementById('dateDate').value;
                    const hour = document.getElementById('dateHour').value;
                    const minute = document.getElementById('dateMinute').value;
                    const ampm = document.getElementById('dateAmPm').value;

                    const display = document.getElementById('dateTimeDisplay');
                    if (!date || !hour || !minute || !ampm) {
                        display.textContent = 'Selected time: --';
                        return;
                    }

                    const hourNum = parseInt(hour, 10);
                    const minuteNum = parseInt(minute, 10);
                    let hourFormatted = hourNum;
                    if (hourFormatted === 0) hourFormatted = 12;
                    display.textContent = `Selected time: ${new Date(`${date}T${String((ampm === 'PM' ? (hourNum % 12) + 12 : hourNum % 12)).padStart(2,'0')}:${String(minuteNum).padStart(2,'0')}:00`).toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true })}`;
                });
            }
        });

        // Handle form submission
        document.getElementById('reportLostForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const dateDate = document.getElementById('dateDate').value;
            const dateHour = document.getElementById('dateHour').value;
            const dateMinute = document.getElementById('dateMinute').value;
            const dateAmPm = document.getElementById('dateAmPm').value;
            const location = document.getElementById('location').value.trim();
            const description = document.getElementById('description').value.trim();
            const contactPhone = document.getElementById('contactPhone').value.trim();
            const imageUrl = document.getElementById('imageUrl').value.trim();

            let dateTime;
            if (dateDate && dateHour && dateMinute && dateAmPm) {
                const hour12 = parseInt(dateHour, 10);
                let hour24 = hour12 % 12;
                if (dateAmPm === 'PM') hour24 += 12;
                const formattedDate = `${dateDate}T${String(hour24).padStart(2, '0')}:${String(dateMinute).padStart(2, '0')}:00`;
                dateTime = new Date(formattedDate).toISOString();
            } else {
                dateTime = '';
            }

            if (!title || !category || !dateTime || !location || !description) {
                Toast.error('Please fill in all required fields');
                return;
            }

            // Validate optional contact phone format
            if (contactPhone) {
                const phoneRegex = /^\+?[0-9\s\-()]{7,20}$/;
                if (!phoneRegex.test(contactPhone)) {
                    Toast.error('Please enter a valid contact phone number');
                    return;
                }
            }

            try {
                const submitBtn = document.querySelector('button[type="submit"]');
                LoadingState.show(submitBtn);
                
                const token = localStorage.getItem('token');
                const response = await fetch('http://localhost:5000/api/items', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({
                        title,
                        category,
                        type: 'lost',
                        dateTime: new Date(dateTime).toISOString(),
                        location,
                        description,
                        contactPhone: contactPhone || null,
                        imageUrl: imageUrl || null,
                    }),
                });

                const data = await response.json();

                if (data.success) {
                    Toast.success('Item posted successfully! Redirecting...');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    Toast.error(data.message || 'Error posting item');
                    LoadingState.hide(submitBtn);
                }
            } catch (error) {
                console.error('Error posting item:', error);
                Toast.error('Error posting item. Please try again.');
                LoadingState.hide(document.querySelector('button[type="submit"]'));
            }
        });

        // Show message function (legacy, kept for compatibility)
        function showMessage(text, type) {
            if (type === 'success') {
                Toast.success(text);
            } else {
                Toast.error(text);
            }
        }

        // Update displayed 12-hour time text when value changes
        document.getElementById('dateTime').addEventListener('change', (e) => {
            const display = document.getElementById('dateTimeDisplay');
            const value = e.target.value;
            if (!value) {
                display.textContent = 'Selected time: --';
                return;
            }
            const parsed = new Date(value);
            if (Number.isNaN(parsed.getTime())) {
                display.textContent = 'Selected time: invalid';
                return;
            }
            display.textContent = `Selected time: ${parsed.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true })}`;
        });
    </script>
</body>
</html>
